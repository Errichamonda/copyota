# Pull requests only build. Pushing a v* tag also publishes a release.
name: Build
on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --locked
        working-directory: mac
      - run: cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
        working-directory: mac
      - run: lipo -create mac/target/*-apple-darwin/release/copyota -output copyota
      - uses: actions/upload-artifact@v7
        with:
          name: copyota
          path: copyota
          if-no-files-found: error

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: printenv ANDROID_KEYSTORE | base64 -d > "$RUNNER_TEMP/copyota.keystore"
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      - run: KEYSTORE="$RUNNER_TEMP/copyota.keystore" android/build.sh
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v7
        with:
          name: copyota.apk
          path: build/copyota.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" copyota copyota.apk --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
