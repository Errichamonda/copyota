# Checks pull requests on Linux. The Mac target is only type-checked, linking it needs Apple's SDK.
name: Build
on:
  pull_request:

jobs:
  mac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-darwin
      - run: cargo test --locked
        working-directory: mac
      - run: cargo check --locked --target aarch64-apple-darwin
        working-directory: mac

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: printenv ANDROID_KEYSTORE | base64 -d > "$RUNNER_TEMP/copyota.keystore"
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      - run: KEYSTORE="$RUNNER_TEMP/copyota.keystore" android/build.sh
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v7
        with:
          name: copyota.apk
          path: build/copyota.apk
          if-no-files-found: error
