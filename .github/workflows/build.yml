# Builds the APK on pull requests. The Swift agent needs AppKit, so only a Mac can build it.
name: Build
on:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: printenv ANDROID_KEYSTORE | base64 -d > "$RUNNER_TEMP/copyota.keystore"
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      - run: KEYSTORE="$RUNNER_TEMP/copyota.keystore" android/build.sh
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v7
        with:
          name: copyota.apk
          path: build/copyota.apk
          if-no-files-found: error
