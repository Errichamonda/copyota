# Builds the APK and the Mac agent on pull requests. Pushing a v* tag also publishes both as a release.
# The Swift agent needs AppKit, so only a Mac can build it.
name: Build
on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fork PRs get no secrets, so they sign with a throwaway key.
      # Tags never do, because installed apps can only update from the release key.
      - run: |
          if [ -z "$ANDROID_KEYSTORE" ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/copyota.keystore" -storepass android -alias copyota -dname CN=throwaway -keyalg RSA -validity 1
          else
            printenv ANDROID_KEYSTORE | base64 -d > "$RUNNER_TEMP/copyota.keystore"
          fi
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
      - run: KEYSTORE="$RUNNER_TEMP/copyota.keystore" android/build.sh
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v7
        with:
          name: copyota.apk
          path: build/copyota.apk
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # swiftc defaults to the runner's CPU and macOS version, so ask for both CPUs and an older macOS.
      # lipo drops the signatures, and Apple silicon won't run an unsigned binary.
      - run: |
          mkdir build
          for arch in arm64 x86_64; do
            swiftc -O -target $arch-apple-macos13 mac/main.swift -o build/copyota-mac-$arch
          done
          lipo -create build/copyota-mac-* -output build/copyota-mac
          codesign -f -s - build/copyota-mac
          tar czf build/copyota-mac.tar.gz -s ',^,copyota/,' copyota README.md android mac worker build/copyota-mac
      - uses: actions/upload-artifact@v7
        with:
          name: copyota-mac.tar.gz
          path: build/copyota-mac.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [apk, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" copyota.apk copyota-mac.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
